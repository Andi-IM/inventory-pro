name: CI/CD Pipeline

on:
  push:
    branches: [ main, 'feature/*', 'fix/*', 'refactor/*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Lint
        run: npm run typecheck
      
      - name: Unit Tests (Vitest)
        run: npm run test
        env:
          DATABASE_URL: postgres://user:password@localhost:5432/db

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgres://user:password@localhost:5432/db
          NEON_AUTH_COOKIE_SECRET: dummy_secret_for_ci_build_only_must_be_32_chars_long
          NEON_AUTH_BASE_URL: http://localhost:3000

  release:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
